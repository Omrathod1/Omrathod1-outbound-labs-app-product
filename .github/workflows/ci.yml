name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name schema-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "src/db/schema changed without a migration. Run: npm run db:generate"
            git status --porcelain drizzle
            exit 1
          fi
      - run: npm run build
